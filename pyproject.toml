[project]
name = "stock-analyzer"
version = "1.0.0"
description = "Multi-Agent AI Equity Research and Validation System for U.S. and Canadian Stocks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "duckdb>=0.10.0",
    "yfinance>=0.2.38",
    "rich>=13.7.0",
    "google-genai>=0.1.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
